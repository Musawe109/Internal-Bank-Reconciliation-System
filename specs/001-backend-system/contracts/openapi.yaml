openapi: 3.1.0
info:
  title: Internal Bank Reconciliation System API
  description: |
    Enterprise-grade API for bank transaction reconciliation.
    Supports CSV upload, automated matching, manual overrides, and approval workflows.
  version: 1.0.0
  contact:
    name: API Support
    email: api-support@ibrs.example.com
  license:
    name: Proprietary

servers:
  - url: https://api.ibrs.example.com/v1
    description: Production server
  - url: https://staging-api.ibrs.example.com/v1
    description: Staging server
  - url: http://localhost:8000/api/v1
    description: Local development server

tags:
  - name: Auth
    description: Authentication and user management
  - name: Reconciliations
    description: Reconciliation session management
  - name: Transactions
    description: Bank and internal transaction operations
  - name: Audit
    description: Audit log and compliance
  - name: Health
    description: System health checks

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login endpoint

  schemas:
    # === Domain Models ===
    
    User:
      type: object
      required:
        - id
        - email
        - name
        - role
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        department:
          type: string
          nullable: true
        isActive:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserRole:
      type: string
      enum:
        - viewer
        - processor
        - approver
        - admin
      description: |
        - viewer: Read-only access
        - processor: Can upload, reconcile, override
        - approver: Can approve/reject reconciliations
        - admin: Full access including user management

    ReconciliationSession:
      type: object
      required:
        - id
        - fileName
        - fileSize
        - uploadedAt
        - uploadedBy
        - totalBankTransactions
        - totalInternalTransactions
        - matchedCount
        - unmatchedBankOnlyCount
        - unmatchedInternalOnlyCount
        - varianceDetectedCount
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        fileSize:
          type: integer
          format: int64
        uploadedAt:
          type: string
          format: date-time
        uploadedBy:
          type: string
          format: uuid
        totalBankTransactions:
          type: integer
        totalInternalTransactions:
          type: integer
        matchedCount:
          type: integer
        unmatchedBankOnlyCount:
          type: integer
        unmatchedInternalOnlyCount:
          type: integer
        varianceDetectedCount:
          type: integer
        status:
          $ref: '#/components/schemas/ReconciliationStatus'
        submittedAt:
          type: string
          format: date-time
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        approvedBy:
          type: string
          format: uuid
          nullable: true
        rejectedAt:
          type: string
          format: date-time
          nullable: true
        rejectedBy:
          type: string
          format: uuid
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        processingStartedAt:
          type: string
          format: date-time
          nullable: true
        processingCompletedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReconciliationStatus:
      type: string
      enum:
        - draft
        - processing
        - pending_approval
        - approved
        - rejected

    BankTransaction:
      type: object
      required:
        - id
        - reconciliationSessionId
        - amount
        - currency
        - transactionDate
        - reference
        - description
        - classification
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        reconciliationSessionId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          description: Positive = credit, Negative = debit
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 currency code
        transactionDate:
          type: string
          format: date
        valueDate:
          type: string
          format: date
          nullable: true
        reference:
          type: string
        description:
          type: string
        counterpartyName:
          type: string
          nullable: true
        counterpartyAccount:
          type: string
          nullable: true
        classification:
          $ref: '#/components/schemas/TransactionClassification'
        matchedInternalTransactionId:
          type: string
          format: uuid
          nullable: true
        varianceAmount:
          type: number
          format: double
          nullable: true
        overrideReason:
          type: string
          nullable: true
        overriddenAt:
          type: string
          format: date-time
          nullable: true
        overriddenBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TransactionClassification:
      type: string
      enum:
        - matched
        - unmatched_bank_only
        - unmatched_internal_only
        - variance_detected

    InternalTransaction:
      type: object
      required:
        - id
        - amount
        - currency
        - transactionDate
        - reference
        - description
        - accountCode
        - costCenter
        - journalEntryId
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        reconciliationSessionId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: number
          format: double
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        transactionDate:
          type: string
          format: date
        reference:
          type: string
        description:
          type: string
        accountCode:
          type: string
        costCenter:
          type: string
        journalEntryId:
          type: string
        lineNumber:
          type: integer
          nullable: true
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        sourceSystem:
          type: string
          enum:
            - ORACLE
            - MANUAL
            - INTEGRATION

    ReconciliationResult:
      type: object
      required:
        - id
        - reconciliationSessionId
        - bankTransactionId
        - classification
        - matchedInternalTransactionIds
        - isOverridden
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        reconciliationSessionId:
          type: string
          format: uuid
        bankTransactionId:
          type: string
          format: uuid
        classification:
          $ref: '#/components/schemas/TransactionClassification'
        confidenceScore:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: ML matching confidence (future feature)
        matchedInternalTransactionIds:
          type: array
          items:
            type: string
            format: uuid
        varianceAmount:
          type: number
          format: double
          nullable: true
        varianceReason:
          type: string
          nullable: true
        isOverridden:
          type: boolean
        previousClassification:
          $ref: '#/components/schemas/TransactionClassification'
          nullable: true
        overrideReason:
          type: string
          nullable: true
        overriddenAt:
          type: string
          format: date-time
          nullable: true
        overriddenBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ManualOverride:
      type: object
      required:
        - id
        - reconciliationSessionId
        - bankTransactionId
        - previousClassification
        - newClassification
        - reason
        - userId
        - userEmail
        - approvalStatus
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        reconciliationSessionId:
          type: string
          format: uuid
        bankTransactionId:
          type: string
          format: uuid
        previousClassification:
          $ref: '#/components/schemas/TransactionClassification'
        newClassification:
          $ref: '#/components/schemas/TransactionClassification'
        reason:
          type: string
          minLength: 10
          maxLength: 500
        supportingDocumentId:
          type: string
          format: uuid
          nullable: true
        userId:
          type: string
          format: uuid
        userEmail:
          type: string
          format: email
        approvalStatus:
          $ref: '#/components/schemas/OverrideApprovalStatus'
        approvedAt:
          type: string
          format: date-time
          nullable: true
        approvedBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time

    OverrideApprovalStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected

    AuditLogEntry:
      type: object
      required:
        - id
        - timestamp
        - userId
        - userEmail
        - userName
        - actionType
        - entityType
        - entityId
        - action
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
        userEmail:
          type: string
          format: email
        userName:
          type: string
        actionType:
          $ref: '#/components/schemas/AuditActionType'
        entityType:
          type: string
          enum:
            - reconciliation
            - transaction
            - override
            - workflow
            - user
            - auth
        entityId:
          type: string
        action:
          type: string
          enum:
            - create
            - update
            - delete
            - submit
            - approve
            - reject
            - login
            - logout
            - export
        previousState:
          type: object
          nullable: true
          additionalProperties: true
        newState:
          type: object
          nullable: true
          additionalProperties: true
        details:
          type: object
          nullable: true
          additionalProperties: true
        ipAddress:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        sessionId:
          type: string
          nullable: true

    AuditActionType:
      type: string
      enum:
        - login
        - logout
        - file_upload
        - reconciliation_create
        - reconciliation_submit
        - reconciliation_approve
        - reconciliation_reject
        - classification_override
        - filter_apply
        - export

    # === API Response Wrappers ===

    ReconciliationSummary:
      type: object
      required:
        - totalTransactions
        - matchedPercentage
        - unmatchedPercentage
        - variancePercentage
        - totalVarianceAmount
      properties:
        totalTransactions:
          type: integer
        matchedPercentage:
          type: number
          format: float
        unmatchedPercentage:
          type: number
          format: float
        variancePercentage:
          type: number
          format: float
        totalVarianceAmount:
          type: number
          format: double

    PaginationMeta:
      type: object
      required:
        - page
        - pageSize
        - totalRows
        - totalPages
        - hasNextPage
        - hasPreviousPage
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalRows:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean

    # === Error Response ===

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              nullable: true
              description: Field-specific validation errors
            stack:
              type: string
              nullable: true
              description: Stack trace (development mode only)

  parameters:
    # Common path parameters
    reconciliationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Reconciliation session ID

    transactionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Transaction ID

    # Common query parameters
    pageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number

    pageSizeParam:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 500
      description: Items per page

    sortParam:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: Sort column name

    orderParam:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
      description: Sort order

paths:
  # === Health Endpoints ===

  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns service health status
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # === Auth Endpoints ===

  /auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: Authenticate user and return JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                  - token
                  - expiresAt
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                    description: JWT access token
                  expiresAt:
                    type: string
                    format: date-time
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: User logout
      description: Invalidate current session
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current user
      description: Returns authenticated user profile
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # === Reconciliation Endpoints ===

  /reconciliations:
    get:
      tags:
        - Reconciliations
      summary: List reconciliations
      description: Returns paginated list of reconciliation sessions
      operationId: listReconciliations
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ReconciliationStatus'
          style: form
          explode: true
          description: Filter by status
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter by upload date (from)
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter by upload date (to)
      responses:
        '200':
          description: List of reconciliations
          content:
            application/json:
              schema:
                type: object
                required:
                  - reconciliations
                  - pagination
                properties:
                  reconciliations:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReconciliationSession'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Reconciliations
      summary: Create reconciliation
      description: Upload bank CSV file and initiate reconciliation
      operationId: createReconciliation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file containing bank transactions
      responses:
        '200':
          description: Reconciliation created
          content:
            application/json:
              schema:
                type: object
                required:
                  - session
                properties:
                  session:
                    $ref: '#/components/schemas/ReconciliationSession'
        '400':
          description: Invalid file format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reconciliations/{id}:
    get:
      tags:
        - Reconciliations
      summary: Get reconciliation
      description: Returns reconciliation session details with summary
      operationId: getReconciliation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/reconciliationId'
      responses:
        '200':
          description: Reconciliation details
          content:
            application/json:
              schema:
                type: object
                required:
                  - session
                  - summary
                properties:
                  session:
                    $ref: '#/components/schemas/ReconciliationSession'
                  summary:
                    $ref: '#/components/schemas/ReconciliationSummary'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Reconciliation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reconciliations/{id}/submit:
    post:
      tags:
        - Reconciliations
      summary: Submit for approval
      description: Submit reconciliation for approval workflow
      operationId: submitReconciliation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/reconciliationId'
      responses:
        '200':
          description: Submitted successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - session
                properties:
                  session:
                    $ref: '#/components/schemas/ReconciliationSession'
        '400':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Reconciliation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reconciliations/{id}/approve:
    post:
      tags:
        - Reconciliations
      summary: Approve reconciliation
      description: Approve reconciliation (locks permanently)
      operationId: approveReconciliation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/reconciliationId'
      responses:
        '200':
          description: Approved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - session
                properties:
                  session:
                    $ref: '#/components/schemas/ReconciliationSession'
        '400':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions (approver required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Reconciliation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reconciliations/{id}/reject:
    post:
      tags:
        - Reconciliations
      summary: Reject reconciliation
      description: Reject reconciliation and return to draft
      operationId: rejectReconciliation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/reconciliationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 500
                  description: Reason for rejection
      responses:
        '200':
          description: Rejected successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - session
                properties:
                  session:
                    $ref: '#/components/schemas/ReconciliationSession'
        '400':
          description: Invalid state transition or missing reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions (approver required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Reconciliation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # === Transaction Endpoints ===

  /reconciliations/{id}/transactions:
    get:
      tags:
        - Transactions
      summary: List transactions
      description: Returns paginated bank transactions for reconciliation
      operationId: getTransactions
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/reconciliationId'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - name: classification
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TransactionClassification'
          style: form
          explode: true
          description: Filter by classification
        - name: searchQuery
          in: query
          required: false
          schema:
            type: string
          description: Search by reference or description
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter by transaction date (from)
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter by transaction date (to)
        - $ref: '#/components/parameters/sortParam'
        - $ref: '#/components/parameters/orderParam'
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: object
                required:
                  - transactions
                  - pagination
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/BankTransaction'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Reconciliation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transactions/{id}/override:
    post:
      tags:
        - Transactions
      summary: Override classification
      description: Manually override transaction classification
      operationId: overrideTransaction
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/transactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - classification
                - reason
              properties:
                classification:
                  $ref: '#/components/schemas/TransactionClassification'
                reason:
                  type: string
                  minLength: 10
                  maxLength: 500
                  description: Reason for override (minimum 10 characters)
      responses:
        '200':
          description: Override successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - transaction
                  - override
                properties:
                  transaction:
                    $ref: '#/components/schemas/BankTransaction'
                  override:
                    $ref: '#/components/schemas/ManualOverride'
        '400':
          description: Invalid classification or reason too short
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions (processor required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Reconciliation already approved (locked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transactions/{id}/overrides:
    get:
      tags:
        - Transactions
      summary: Get override history
      description: Returns all overrides for a transaction
      operationId: getOverrides
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/transactionId'
      responses:
        '200':
          description: Override history
          content:
            application/json:
              schema:
                type: object
                required:
                  - overrides
                properties:
                  overrides:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManualOverride'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # === Audit Endpoints ===

  /audit-logs:
    get:
      tags:
        - Audit
      summary: List audit logs
      description: Returns paginated audit log entries
      operationId: getAuditLogs
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - name: actionType
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AuditActionType'
          style: form
          explode: true
          description: Filter by action type
        - name: entityType
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - reconciliation
                - transaction
                - override
                - workflow
                - user
                - auth
          style: form
          explode: true
          description: Filter by entity type
        - name: userId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by user ID
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter by timestamp (from)
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter by timestamp (to)
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                required:
                  - logs
                  - pagination
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

security:
  - BearerAuth: []
